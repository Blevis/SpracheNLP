[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sprache"
version = "2.1.0"
description = "German Wikipedia corpus, spaCy analysis and NLTK named-entity recognition (Group 2)"
requires-python = ">=3.10"
dependencies = [
    "spacy>=3.7,<3.9",
    "pandas>=2.0",
    "requests>=2.31",
    "nltk>=3.9",
    "python-crfsuite>=0.9.10",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4", "ipykernel", "nbconvert>=7"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "model: needs the de_core_news_md spaCy model",
]
